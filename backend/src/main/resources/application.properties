# Application Configurations
server.port=8081
spring.application.name=fisioplus-backend

# MySQL Database Configurations
spring.datasource.url=jdbc:mysql://localhost:3306/fisioplus_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA and Hibernate Configurations
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT Configurations (Base64 Secret: FisioPlusSecureAndPremiumTokenSecretForSpringSecurity35)
fisioplus.jwt.secret=RmlzaW9QbHVzU2VjdXJlQW5kUHJlbWl1bVRva2VuU2VjcmV0Rm9yU3ByaW5nU2VjdXJpdHkzNQ==
fisioplus.jwt.expiration-ms=86400000

# File Upload Configurations
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# Logging Configuration
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=DEBUG

# ================================================================
# MÓDULO DE RECORDATORIOS Y NOTIFICACIONES
# ================================================================

# URL base del frontend (usada en los enlaces de los emails/WhatsApp)
fisioplus.app.base-url=http://localhost:5173
# Horas de validez del token (cita + margen post-cita)
fisioplus.app.token-expiry-hours=26

# --- Correo Electrónico (Gmail con App Password) ---
# IMPORTANTE: Usar una App Password de Google, NO la contraseña normal.
# Ir a: myaccount.google.com/apppasswords
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=notificaciones@tudominio.com
spring.mail.password=REEMPLAZAR_CON_APP_PASSWORD
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# --- WhatsApp ---
# Número del bot con código de país sin el signo + (ej: 521XXXXXXXXXX para México)
fisioplus.whatsapp.bot-number=521XXXXXXXXXX
# Cambiar a true cuando el número de WhatsApp esté configurado
fisioplus.whatsapp.enabled=false

# --- Scheduler ---
# Corre cada hora en punto. Detecta citas en ventana [ahora+23h, ahora+25h].
fisioplus.scheduler.recordatorio-cron=0 0 * * * *

# --- Thread Pools ---
spring.task.scheduling.pool.size=4
spring.task.execution.pool.core-size=4
spring.task.execution.pool.max-size=8
spring.task.execution.pool.queue-capacity=100
